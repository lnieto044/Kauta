# Kauta con PostgreSQL. Uso: copie .env.example como .env y ejecute  docker compose up --build
services:
  kauta:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      KAUTA_BD: postgresql+psycopg://kauta:${POSTGRES_PASSWORD}@db:5432/kauta
    depends_on:
      db: { condition: service_healthy }
    read_only: true                     # sistema de archivos de solo lectura
    tmpfs: ["/tmp"]
    volumes: ["kauta-var:/var/kauta"]   # claves de la demo y archivos cargados
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kauta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kauta
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kauta"], interval: 5s, retries: 10 }
    volumes: ["pg:/var/lib/postgresql/data"]
    restart: unless-stopped
volumes:
  kauta-var: {}
  pg: {}
